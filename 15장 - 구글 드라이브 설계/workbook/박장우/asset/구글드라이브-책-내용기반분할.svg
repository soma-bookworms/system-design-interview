<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" width="640" height="256" font-family="'Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif"><style>.nt{font-size:14px;font-weight:600;fill:#12161F;text-anchor:middle;dominant-baseline:central}.nm{font-size:12.5px;fill:#12161F;text-anchor:middle;dominant-baseline:central}.ns{font-size:11.5px;fill:#4F586B;text-anchor:middle;dominant-baseline:central}.nh{font-size:12.5px;font-weight:600;fill:#4F586B;text-anchor:start;dominant-baseline:central}.nc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:#12161F;text-anchor:middle;dominant-baseline:central}.nk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;fill:#12161F;text-anchor:middle;dominant-baseline:central}.l{text-anchor:start}.r{text-anchor:end}.b{font-weight:700}.bad{fill:#C0504F}.good{fill:#2B7A4E}.hl{fill:#2F5FD0;font-weight:700}.halo{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}.ed{fill:none;stroke-width:1.6}.dash{stroke-dasharray:5 4}.life{stroke:#B7BECC;stroke-width:1.2;stroke-dasharray:4 4}.sep{stroke:#E2E5EC;stroke-width:1}.grp{fill:#F7F8FB;stroke:#B7BECC;stroke-width:1.2}.band{fill:none;stroke:#B7BECC;stroke-width:1;stroke-dasharray:5 4}.zone{fill:none;stroke:#9AA2B3;stroke-width:1.2;stroke-dasharray:5 4}.note{fill:#FBF0DA;stroke:#C49A4A;stroke-width:1}.note-bad{fill:#F9E3E2;stroke:#C0504F;stroke-width:1}.note-good{fill:#E2F1E7;stroke:#4E9A6F;stroke-width:1}.act{fill:#FBE7DC;stroke:#CF7B4E;stroke-width:1}.blk{fill:#F3F4F7;stroke:#A9B1C0;stroke-width:1.2}.bup{fill:#E3EAF7;stroke:#6F8AC7;stroke-width:1.4}.bdn{fill:#E2F1E7;stroke:#4E9A6F;stroke-width:1.4}.bbad{fill:#F9E3E2;stroke:#C0504F;stroke-width:1.4}.benc{fill:#ECE6F6;stroke:#8A71B6;stroke-width:1.4}.bq{fill:#F9E1E1;stroke:#C45A5A;stroke-width:1.2}.barfill{fill:#8A71B6}.dia{fill:#EEF0F4;stroke:#A9B1C0;stroke-width:1.4}.th{fill:#DCE0E8;stroke:#A9B1C0;stroke-width:1.2}.tb{fill:#FFFFFF;stroke:#A9B1C0;stroke-width:1.2}.axis{stroke:#8A92A5;stroke-width:1.2}.warn{fill:#C0504F}.warnt{fill:#FFFFFF;font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}.k-dev rect{fill:#FFFFFF;stroke:#8E96A8;stroke-width:1.4}.k-src rect{fill:#EEF0F4;stroke:#A9B1C0;stroke-width:1.4}.k-ext rect{fill:#DFF0F2;stroke:#4B98A6;stroke-width:1.4}.k-db rect{fill:#ECE6F6;stroke:#8A71B6;stroke-width:1.4}.k-q rect{fill:#FBF0DA;stroke:#C49A4A;stroke-width:1.4}.k-fn rect{fill:#FBE7DC;stroke:#CF7B4E;stroke-width:1.4}.k-mq rect{fill:#F9E1E1;stroke:#C45A5A;stroke-width:1.4}.k-app rect{fill:#E4EBFA;stroke:#6F8AC7;stroke-width:1.4}.k-sch rect{fill:#E1F1E7;stroke:#4E9A6F;stroke-width:1.4}.k-st rect{fill:#F7F8FB;stroke:#9AA2B3;stroke-width:1.4}.k-err rect{fill:#F9E3E2;stroke:#C0504F;stroke-width:1.6}@media (prefers-color-scheme: dark){.nt,.nm,.nc,.nk{fill:#E7EAF1}.ns,.nh{fill:#A3AABB}.bad{fill:#E27A78}.good{fill:#7CCB9C}.hl{fill:#7C9CF0}.halo{stroke:#1E1E1E}.life{stroke:#3A4254}.sep{stroke:#2A3140}.grp{fill:#171C26;stroke:#3A4254}.band{stroke:#3A4254}.zone{stroke:#4A5366}.note{fill:#2E2412;stroke:#B08840}.note-bad{fill:#321717;stroke:#C0504F}.note-good{fill:#132A1D;stroke:#4E9A6F}.act{fill:#33200F;stroke:#C27446}.blk{fill:#1A1F2A;stroke:#4A5366}.bup{fill:#18233A}.bdn{fill:#132A1D}.bbad{fill:#321717}.benc{fill:#231C33}.bq{fill:#2E1616;stroke:#B35454}.dia{fill:#1A1F2A;stroke:#4A5366}.th{fill:#2A3140;stroke:#4A5366}.tb{fill:#12161E;stroke:#4A5366}.axis{stroke:#6C7486}.k-dev rect{fill:#12161E;stroke:#6C7486}.k-src rect{fill:#1A1F2A;stroke:#4A5366}.k-ext rect{fill:#10292E;stroke:#4491A0}.k-db rect{fill:#231C33;stroke:#8A71B6}.k-q rect{fill:#2E2412;stroke:#B08840}.k-fn rect{fill:#33200F;stroke:#C27446}.k-mq rect{fill:#2E1616;stroke:#B35454}.k-app rect{fill:#172440;stroke:#5877BD}.k-sch rect{fill:#122A1C;stroke:#4E9A6F}.k-st rect{fill:#171C26;stroke:#4A5366}.k-err rect{fill:#321717;stroke:#C0504F}}</style><defs><marker id="ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8A92A5"/></marker><marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6F8AC7"/></marker><marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#4E9A6F"/></marker><marker id="lp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#CF7B4E"/></marker><marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C0504F"/></marker></defs><text class="nh" x="20" y="28">고정 크기: 4글자마다 자름</text><text class="ns r" x="116" y="63">원본</text><rect class="blk" x="130" y="48" width="49.6" height="30" rx="5"/><text class="nk" x="154.8" y="63">abc.</text><rect class="blk" x="187.6" y="48" width="49.6" height="30" rx="5"/><text class="nk" x="212.4" y="63">defg</text><rect class="blk" x="245.2" y="48" width="49.6" height="30" rx="5"/><text class="nk" x="270.0" y="63">h.ij</text><rect class="blk" x="302.8" y="48" width="49.6" height="30" rx="5"/><text class="nk" x="327.6" y="63">.klm</text><rect class="blk" x="360.40000000000003" y="48" width="25.9" height="30" rx="5"/><text class="nk" x="373.35" y="63">.</text><text class="ns r" x="116" y="103">앞에 X 추가</text><rect class="bbad" x="130" y="88" width="49.6" height="30" rx="5"/><text class="nk" x="154.8" y="103">Xabc</text><rect class="bbad" x="187.6" y="88" width="49.6" height="30" rx="5"/><text class="nk" x="212.4" y="103">.def</text><rect class="bbad" x="245.2" y="88" width="49.6" height="30" rx="5"/><text class="nk" x="270.0" y="103">gh.i</text><rect class="bbad" x="302.8" y="88" width="49.6" height="30" rx="5"/><text class="nk" x="327.6" y="103">j.kl</text><rect class="bbad" x="360.40000000000003" y="88" width="33.8" height="30" rx="5"/><text class="nk" x="377.3" y="103">m.</text><text class="ns bad l" x="430" y="103">5개 모두 새 블록, 전부 다시 올림</text><text class="nh" x="20" y="150">내용 기반: 마침표 뒤에서 자름</text><text class="ns r" x="116" y="185">원본</text><rect class="blk" x="130" y="170" width="49.6" height="30" rx="5"/><text class="nk" x="154.8" y="185">abc.</text><rect class="blk" x="187.6" y="170" width="65.4" height="30" rx="5"/><text class="nk" x="220.3" y="185">defgh.</text><rect class="blk" x="261.0" y="170" width="41.7" height="30" rx="5"/><text class="nk" x="281.85" y="185">ij.</text><rect class="blk" x="310.7" y="170" width="49.6" height="30" rx="5"/><text class="nk" x="335.5" y="185">klm.</text><text class="ns r" x="116" y="225">앞에 X 추가</text><rect class="bbad" x="130" y="210" width="57.5" height="30" rx="5"/><text class="nk" x="158.75" y="225">Xabc.</text><rect class="blk" x="195.5" y="210" width="65.4" height="30" rx="5"/><text class="nk" x="228.2" y="225">defgh.</text><rect class="blk" x="268.9" y="210" width="41.7" height="30" rx="5"/><text class="nk" x="289.75" y="225">ij.</text><rect class="blk" x="318.59999999999997" y="210" width="49.6" height="30" rx="5"/><text class="nk" x="343.4" y="225">klm.</text><text class="ns good l" x="430" y="225">첫 블록만 새 블록, 하나만 올림</text></svg>
