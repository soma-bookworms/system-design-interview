<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif"><style>.nt{font-size:14px;font-weight:600;fill:#12161F;text-anchor:middle;dominant-baseline:central}.nm{font-size:12.5px;fill:#12161F;text-anchor:middle;dominant-baseline:central}.ns{font-size:11.5px;fill:#4F586B;text-anchor:middle;dominant-baseline:central}.nh{font-size:12.5px;font-weight:600;fill:#4F586B;text-anchor:start;dominant-baseline:central}.nc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:#12161F;text-anchor:middle;dominant-baseline:central}.nk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;fill:#12161F;text-anchor:middle;dominant-baseline:central}.l{text-anchor:start}.r{text-anchor:end}.b{font-weight:700}.bad{fill:#C0504F}.good{fill:#2B7A4E}.hl{fill:#2F5FD0;font-weight:700}.halo{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}.ed{fill:none;stroke-width:1.6}.dash{stroke-dasharray:5 4}.life{stroke:#B7BECC;stroke-width:1.2;stroke-dasharray:4 4}.sep{stroke:#E2E5EC;stroke-width:1}.grp{fill:#F7F8FB;stroke:#B7BECC;stroke-width:1.2}.band{fill:none;stroke:#B7BECC;stroke-width:1;stroke-dasharray:5 4}.zone{fill:none;stroke:#9AA2B3;stroke-width:1.2;stroke-dasharray:5 4}.note{fill:#FBF0DA;stroke:#C49A4A;stroke-width:1}.note-bad{fill:#F9E3E2;stroke:#C0504F;stroke-width:1}.note-good{fill:#E2F1E7;stroke:#4E9A6F;stroke-width:1}.act{fill:#FBE7DC;stroke:#CF7B4E;stroke-width:1}.blk{fill:#F3F4F7;stroke:#A9B1C0;stroke-width:1.2}.bup{fill:#E3EAF7;stroke:#6F8AC7;stroke-width:1.4}.bdn{fill:#E2F1E7;stroke:#4E9A6F;stroke-width:1.4}.bbad{fill:#F9E3E2;stroke:#C0504F;stroke-width:1.4}.benc{fill:#ECE6F6;stroke:#8A71B6;stroke-width:1.4}.bq{fill:#F9E1E1;stroke:#C45A5A;stroke-width:1.2}.barfill{fill:#8A71B6}.dia{fill:#EEF0F4;stroke:#A9B1C0;stroke-width:1.4}.th{fill:#DCE0E8;stroke:#A9B1C0;stroke-width:1.2}.tb{fill:#FFFFFF;stroke:#A9B1C0;stroke-width:1.2}.axis{stroke:#8A92A5;stroke-width:1.2}.warn{fill:#C0504F}.warnt{fill:#FFFFFF;font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}.k-dev rect{fill:#FFFFFF;stroke:#8E96A8;stroke-width:1.4}.k-src rect{fill:#EEF0F4;stroke:#A9B1C0;stroke-width:1.4}.k-ext rect{fill:#DFF0F2;stroke:#4B98A6;stroke-width:1.4}.k-db rect{fill:#ECE6F6;stroke:#8A71B6;stroke-width:1.4}.k-q rect{fill:#FBF0DA;stroke:#C49A4A;stroke-width:1.4}.k-fn rect{fill:#FBE7DC;stroke:#CF7B4E;stroke-width:1.4}.k-mq rect{fill:#F9E1E1;stroke:#C45A5A;stroke-width:1.4}.k-app rect{fill:#E4EBFA;stroke:#6F8AC7;stroke-width:1.4}.k-sch rect{fill:#E1F1E7;stroke:#4E9A6F;stroke-width:1.4}.k-st rect{fill:#F7F8FB;stroke:#9AA2B3;stroke-width:1.4}.k-err rect{fill:#F9E3E2;stroke:#C0504F;stroke-width:1.6}@media (prefers-color-scheme: dark){.nt,.nm,.nc,.nk{fill:#E7EAF1}.ns,.nh{fill:#A3AABB}.bad{fill:#E27A78}.good{fill:#7CCB9C}.hl{fill:#7C9CF0}.halo{stroke:#1E1E1E}.life{stroke:#3A4254}.sep{stroke:#2A3140}.grp{fill:#171C26;stroke:#3A4254}.band{stroke:#3A4254}.zone{stroke:#4A5366}.note{fill:#2E2412;stroke:#B08840}.note-bad{fill:#321717;stroke:#C0504F}.note-good{fill:#132A1D;stroke:#4E9A6F}.act{fill:#33200F;stroke:#C27446}.blk{fill:#1A1F2A;stroke:#4A5366}.bup{fill:#18233A}.bdn{fill:#132A1D}.bbad{fill:#321717}.benc{fill:#231C33}.bq{fill:#2E1616;stroke:#B35454}.dia{fill:#1A1F2A;stroke:#4A5366}.th{fill:#2A3140;stroke:#4A5366}.tb{fill:#12161E;stroke:#4A5366}.axis{stroke:#6C7486}.k-dev rect{fill:#12161E;stroke:#6C7486}.k-src rect{fill:#1A1F2A;stroke:#4A5366}.k-ext rect{fill:#10292E;stroke:#4491A0}.k-db rect{fill:#231C33;stroke:#8A71B6}.k-q rect{fill:#2E2412;stroke:#B08840}.k-fn rect{fill:#33200F;stroke:#C27446}.k-mq rect{fill:#2E1616;stroke:#B35454}.k-app rect{fill:#172440;stroke:#5877BD}.k-sch rect{fill:#122A1C;stroke:#4E9A6F}.k-st rect{fill:#171C26;stroke:#4A5366}.k-err rect{fill:#321717;stroke:#C0504F}}</style><defs><marker id="ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8A92A5"/></marker><marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6F8AC7"/></marker><marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#4E9A6F"/></marker><marker id="lp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#CF7B4E"/></marker><marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C0504F"/></marker></defs><rect class="grp" x="20" y="20" width="410" height="262" rx="10"/><text class="nh" x="34" y="38">책: 오프라인 사용자 백업 큐</text><text class="nm l" x="40" y="80">폰 큐</text><rect class="bq" x="120" y="65" width="34" height="30" rx="4"/><text class="nm" x="137" y="80">42</text><rect class="bq" x="162" y="65" width="34" height="30" rx="4"/><text class="nm" x="179" y="80">43</text><text class="nm l" x="40" y="128">태블릿 큐</text><rect class="bq" x="120" y="113" width="34" height="30" rx="4"/><text class="nm" x="137" y="128">12</text><rect class="bq" x="162" y="113" width="34" height="30" rx="4"/><text class="nm" x="179" y="128">13</text><rect class="bq" x="204" y="113" width="34" height="30" rx="4"/><text class="nm" x="221" y="128">14</text><rect class="bq" x="246" y="113" width="34" height="30" rx="4"/><text class="nm" x="263" y="128">15</text><rect class="bq" x="288" y="113" width="34" height="30" rx="4"/><text class="nm" x="305" y="128">…</text><rect class="bq" x="330" y="113" width="34" height="30" rx="4"/><text class="nm" x="347" y="128">43</text><text class="nm l" x="40" y="176">노트북 큐</text><text class="ns l" x="120" y="176">비어 있음</text><text class="ns l" x="40" y="228">단말마다 큐가 하나씩 필요</text><text class="ns bad l" x="40" y="252">오래 꺼진 단말일수록 큐가 계속 쌓임</text><rect class="grp" x="450" y="20" width="410" height="262" rx="10"/><text class="nh" x="464" y="38">보충: 변경 기록 + 커서</text><text class="ns l" x="470" y="64">변경 기록 (DB, 순번)</text><rect class="blk" x="470" y="78" width="52" height="32" rx="5"/><text class="nm" x="496" y="94">38</text><rect class="blk" x="532" y="78" width="52" height="32" rx="5"/><text class="nm" x="558" y="94">39</text><rect class="blk" x="594" y="78" width="52" height="32" rx="5"/><text class="nm" x="620" y="94">40</text><rect class="blk" x="656" y="78" width="52" height="32" rx="5"/><text class="nm" x="682" y="94">41</text><rect class="bdn" x="718" y="78" width="52" height="32" rx="5"/><text class="nm" x="744" y="94">42</text><rect class="bdn" x="780" y="78" width="52" height="32" rx="5"/><text class="nm" x="806" y="94">43</text><path class="ed" stroke="#8A92A5" marker-end="url(#ctl)" d="M682,140 L682,116"/><text class="ns" x="682" y="152">폰 커서 = 41</text><path class="ed" stroke="#8A92A5" marker-end="url(#ctl)" d="M806,140 L806,116"/><text class="ns" x="806" y="152">노트북 커서 = 43</text><text class="ns l" x="470" y="196">폰이 켜지면 41 이후 변경 요청 → 42, 43</text><text class="ns l" x="470" y="222">단말마다 숫자 하나만 기억</text><text class="ns good l" x="470" y="248">알림을 놓쳐도 다음 요청 때 커서로 가져옴</text></svg>
