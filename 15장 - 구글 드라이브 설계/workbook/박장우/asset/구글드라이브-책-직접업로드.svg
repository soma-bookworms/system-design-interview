<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 362" width="900" height="362" font-family="'Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif"><style>.nt{font-size:14px;font-weight:600;fill:#12161F;text-anchor:middle;dominant-baseline:central}.nm{font-size:12.5px;fill:#12161F;text-anchor:middle;dominant-baseline:central}.ns{font-size:11.5px;fill:#4F586B;text-anchor:middle;dominant-baseline:central}.nh{font-size:12.5px;font-weight:600;fill:#4F586B;text-anchor:start;dominant-baseline:central}.nc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:#12161F;text-anchor:middle;dominant-baseline:central}.nk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;fill:#12161F;text-anchor:middle;dominant-baseline:central}.l{text-anchor:start}.r{text-anchor:end}.b{font-weight:700}.bad{fill:#C0504F}.good{fill:#2B7A4E}.hl{fill:#2F5FD0;font-weight:700}.halo{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}.ed{fill:none;stroke-width:1.6}.dash{stroke-dasharray:5 4}.life{stroke:#B7BECC;stroke-width:1.2;stroke-dasharray:4 4}.sep{stroke:#E2E5EC;stroke-width:1}.grp{fill:#F7F8FB;stroke:#B7BECC;stroke-width:1.2}.band{fill:none;stroke:#B7BECC;stroke-width:1;stroke-dasharray:5 4}.zone{fill:none;stroke:#9AA2B3;stroke-width:1.2;stroke-dasharray:5 4}.note{fill:#FBF0DA;stroke:#C49A4A;stroke-width:1}.note-bad{fill:#F9E3E2;stroke:#C0504F;stroke-width:1}.note-good{fill:#E2F1E7;stroke:#4E9A6F;stroke-width:1}.act{fill:#FBE7DC;stroke:#CF7B4E;stroke-width:1}.blk{fill:#F3F4F7;stroke:#A9B1C0;stroke-width:1.2}.bup{fill:#E3EAF7;stroke:#6F8AC7;stroke-width:1.4}.bdn{fill:#E2F1E7;stroke:#4E9A6F;stroke-width:1.4}.bbad{fill:#F9E3E2;stroke:#C0504F;stroke-width:1.4}.benc{fill:#ECE6F6;stroke:#8A71B6;stroke-width:1.4}.bq{fill:#F9E1E1;stroke:#C45A5A;stroke-width:1.2}.barfill{fill:#8A71B6}.dia{fill:#EEF0F4;stroke:#A9B1C0;stroke-width:1.4}.th{fill:#DCE0E8;stroke:#A9B1C0;stroke-width:1.2}.tb{fill:#FFFFFF;stroke:#A9B1C0;stroke-width:1.2}.axis{stroke:#8A92A5;stroke-width:1.2}.warn{fill:#C0504F}.warnt{fill:#FFFFFF;font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}.k-dev rect{fill:#FFFFFF;stroke:#8E96A8;stroke-width:1.4}.k-src rect{fill:#EEF0F4;stroke:#A9B1C0;stroke-width:1.4}.k-ext rect{fill:#DFF0F2;stroke:#4B98A6;stroke-width:1.4}.k-db rect{fill:#ECE6F6;stroke:#8A71B6;stroke-width:1.4}.k-q rect{fill:#FBF0DA;stroke:#C49A4A;stroke-width:1.4}.k-fn rect{fill:#FBE7DC;stroke:#CF7B4E;stroke-width:1.4}.k-mq rect{fill:#F9E1E1;stroke:#C45A5A;stroke-width:1.4}.k-app rect{fill:#E4EBFA;stroke:#6F8AC7;stroke-width:1.4}.k-sch rect{fill:#E1F1E7;stroke:#4E9A6F;stroke-width:1.4}.k-st rect{fill:#F7F8FB;stroke:#9AA2B3;stroke-width:1.4}.k-err rect{fill:#F9E3E2;stroke:#C0504F;stroke-width:1.6}@media (prefers-color-scheme: dark){.nt,.nm,.nc,.nk{fill:#E7EAF1}.ns,.nh{fill:#A3AABB}.bad{fill:#E27A78}.good{fill:#7CCB9C}.hl{fill:#7C9CF0}.halo{stroke:#1E1E1E}.life{stroke:#3A4254}.sep{stroke:#2A3140}.grp{fill:#171C26;stroke:#3A4254}.band{stroke:#3A4254}.zone{stroke:#4A5366}.note{fill:#2E2412;stroke:#B08840}.note-bad{fill:#321717;stroke:#C0504F}.note-good{fill:#132A1D;stroke:#4E9A6F}.act{fill:#33200F;stroke:#C27446}.blk{fill:#1A1F2A;stroke:#4A5366}.bup{fill:#18233A}.bdn{fill:#132A1D}.bbad{fill:#321717}.benc{fill:#231C33}.bq{fill:#2E1616;stroke:#B35454}.dia{fill:#1A1F2A;stroke:#4A5366}.th{fill:#2A3140;stroke:#4A5366}.tb{fill:#12161E;stroke:#4A5366}.axis{stroke:#6C7486}.k-dev rect{fill:#12161E;stroke:#6C7486}.k-src rect{fill:#1A1F2A;stroke:#4A5366}.k-ext rect{fill:#10292E;stroke:#4491A0}.k-db rect{fill:#231C33;stroke:#8A71B6}.k-q rect{fill:#2E2412;stroke:#B08840}.k-fn rect{fill:#33200F;stroke:#C27446}.k-mq rect{fill:#2E1616;stroke:#B35454}.k-app rect{fill:#172440;stroke:#5877BD}.k-sch rect{fill:#122A1C;stroke:#4E9A6F}.k-st rect{fill:#171C26;stroke:#4A5366}.k-err rect{fill:#321717;stroke:#C0504F}}</style><defs><marker id="ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8A92A5"/></marker><marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6F8AC7"/></marker><marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#4E9A6F"/></marker><marker id="lp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#CF7B4E"/></marker><marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C0504F"/></marker></defs><rect class="grp" x="20" y="20" width="860" height="140" rx="10"/><text class="nh" x="34" y="38">책 설계: 블록 저장소 서버를 거침</text><g class="k-dev"><rect x="40" y="66" width="130" height="60" rx="8"/><text class="nt" x="105.0" y="88.0">단말</text><text class="ns" x="105.0" y="105.0">파일 그대로 보냄</text></g><g class="k-app"><rect x="360" y="58" width="200" height="76" rx="8"/><text class="nt" x="460.0" y="80.0">블록 저장소 서버</text><text class="ns" x="460.0" y="97.0">분할, 압축, 암호화</text><text class="ns" x="460.0" y="113.0">업로드 중 검사 가능</text></g><g class="k-db"><rect x="740" y="66" width="120" height="60" rx="8"/><text class="nt" x="800.0" y="96.0">S3</text></g><path class="ed" stroke="#C0504F" stroke-width="3" marker-end="url(#bad)" d="M174,96 L354,96"/><text class="ns bad halo" x="264" y="83">파일 전체</text><text class="ns halo" x="264" y="110">사용자 회선</text><path class="ed" stroke="#6F8AC7" marker-end="url(#up)" d="M564,96 L734,96"/><text class="ns halo" x="649" y="83">블록</text><text class="ns halo" x="649" y="110">데이터센터 안</text><text class="ns bad" x="460" y="148">모든 업로드 바이트가 서버를 지나감</text><rect class="grp" x="20" y="180" width="860" height="166" rx="10"/><text class="nh" x="34" y="198">다른 선택지: S3에 직접 업로드</text><g class="k-dev"><rect x="40" y="238" width="150" height="64" rx="8"/><text class="nt" x="115.0" y="262.0">단말</text><text class="ns" x="115.0" y="279.0">분할, 해시 계산</text></g><g class="k-src"><rect x="370" y="212" width="170" height="52" rx="8"/><text class="nt" x="455.0" y="230.0">API 서버</text><text class="ns" x="455.0" y="247.0">URL만 서명</text></g><g class="k-db"><rect x="720" y="238" width="140" height="64" rx="8"/><text class="nt" x="790.0" y="262.0">S3</text><text class="ns" x="790.0" y="279.0">SSE 암호화, 체크섬 확인</text></g><path class="ed" stroke="#8A92A5" marker-end="url(#ctl)" d="M194,250 C270,250 290,238 364,238"/><text class="ns halo" x="272" y="228">① presigned URL 요청</text><path class="ed" stroke="#4E9A6F" marker-end="url(#dn)" d="M194,290 L714,290"/><text class="ns good halo" x="455" y="277">② 바뀐 블록만 직접 전송</text><text class="ns halo" x="455" y="303">사용자 회선</text><text class="ns good" x="455" y="330">서버는 파일 바이트를 거치지 않음</text></svg>
