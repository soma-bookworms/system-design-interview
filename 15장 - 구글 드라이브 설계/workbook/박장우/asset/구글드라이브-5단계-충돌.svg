<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" font-family="'Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif"><style>.nt{font-size:14px;font-weight:600;fill:#12161F;text-anchor:middle;dominant-baseline:central}.ns{font-size:11.5px;fill:#4F586B;text-anchor:middle;dominant-baseline:central}.nh{font-size:12px;font-weight:600;fill:#4F586B;text-anchor:start;dominant-baseline:central}.ed{fill:none;stroke-width:1.6}.life{stroke:#B7BECC;stroke-width:1.2;stroke-dasharray:4 4}.band{fill:#F7F8FB;stroke:#B7BECC;stroke-width:1;stroke-dasharray:5 4}.mask{fill:#F7F8FB}.note rect{fill:#FBF0DA;stroke:#C49A4A;stroke-width:1}.k-dev rect{fill:#FFFFFF;stroke:#8E96A8;stroke-width:1.4}.k-src rect{fill:#EEF0F4;stroke:#A9B1C0;stroke-width:1.4}@media (prefers-color-scheme: dark){.nt{fill:#E7EAF1}.ns,.nh{fill:#A3AABB}.life{stroke:#3A4254}.band{fill:#171C26;stroke:#3A4254}.mask{fill:#171C26}.note rect{fill:#2E2412;stroke:#B08840}.k-dev rect{fill:#12161E;stroke:#6C7486}.k-src rect{fill:#1A1F2A;stroke:#4A5366}}</style><defs><marker id="ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8A92A5"/></marker><marker id="lp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#CF7B4E"/></marker></defs><rect class="band" x="16" y="292" width="808" height="118" rx="8"/><line class="life" x1="140" y1="58" x2="140" y2="404"/><line class="life" x1="410" y1="58" x2="410" y2="404"/><line class="life" x1="680" y1="58" x2="680" y2="404"/><rect class="mask" x="24" y="299" width="236" height="22"/><text class="nh" x="30" y="310">그래도 겹치면 (오프라인으로 고친 경우)</text><path class="ed" stroke="#8A92A5" marker-end="url(#ctl)" d="M147,100 L403,100"/><text class="ns" x="275" y="88">① 편집 시작</text><g class="note"><rect x="428" y="88" width="210" height="24" rx="5"/><text class="ns" x="533" y="100">editing:7 = 노트북 (TTL 60초)</text></g><path class="ed" stroke="#CF7B4E" marker-end="url(#lp)" d="M417,150 L673,150"/><text class="ns" x="545" y="138">② 노트북에서 편집 중</text><text class="ns" x="760" y="150">편집 대기 표시</text><path class="ed" stroke="#8A92A5" marker-end="url(#ctl)" d="M147,206 L403,206"/><text class="ns" x="275" y="194">③ 저장 (버전 4), 편집 끝</text><path class="ed" stroke="#CF7B4E" marker-end="url(#lp)" d="M417,256 L673,256"/><text class="ns" x="545" y="244">④ 편집 가능, 버전 4</text><text class="ns" x="760" y="256">최신본 받고 편집</text><path class="ed" stroke="#8A92A5" marker-end="url(#ctl)" d="M673,340 L417,340"/><text class="ns" x="545" y="328">complete (기준 버전 3)</text><text class="ns" x="300" y="340">현재 버전이 4라 충돌</text><path class="ed" stroke="#8A92A5" marker-end="url(#ctl)" d="M417,384 L673,384"/><text class="ns" x="545" y="372">409, 충돌 사본으로 저장</text><text class="ns" x="760" y="376">최신 받기</text><text class="ns" x="760" y="392">나란히 비교</text><g class="k-dev"><rect x="80" y="16" width="120" height="42" rx="8"/><text class="nt" x="140" y="37">노트북</text></g><g class="k-src"><rect x="330" y="16" width="160" height="42" rx="8"/><text class="nt" x="410" y="37">API 서버, Redis</text></g><g class="k-dev"><rect x="620" y="16" width="120" height="42" rx="8"/><text class="nt" x="680" y="37">폰</text></g></svg>
