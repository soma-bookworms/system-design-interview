<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" font-family="'Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif"><style>.hd{font-size:14px;font-weight:600;fill:#12161F;text-anchor:middle;dominant-baseline:central}.sb{font-size:11px;fill:#4F586B;text-anchor:middle;dominant-baseline:central}.ll{stroke:#B7BECC;stroke-width:1.2;stroke-dasharray:5 5}.ar{stroke:#6B7488;stroke-width:1.6;fill:none}.ar.dash{stroke-dasharray:5 4}.lb{font-size:12.5px;fill:#12161F;text-anchor:middle}.nt2{font-size:11.5px;fill:#8A92A5;text-anchor:middle}.band{fill:#C49A4A;opacity:.16}.bandt{font-size:11.5px;fill:#A9762A;text-anchor:end}.proc{font-size:11.5px;fill:#8A92A5;text-anchor:start}.k-src-app rect{fill:#E4EBFA;stroke:#6F8AC7;stroke-width:1.4}.k-q rect{fill:#FBF0DA;stroke:#C49A4A;stroke-width:1.4}.k-fn rect{fill:#FBE7DC;stroke:#CF7B4E;stroke-width:1.4}@media (prefers-color-scheme: dark){.hd{fill:#E7EAF1}.sb{fill:#A3AABB}.ll{stroke:#3A4254}.ar{stroke:#8A93A8}.lb{fill:#E7EAF1}.nt2{fill:#6C7486}.bandt{fill:#D2A150}.proc{fill:#6C7486}.k-src-app rect{fill:#172440;stroke:#5877BD}.k-q rect{fill:#2E2412;stroke:#B08840}.k-fn rect{fill:#33200F;stroke:#C27446}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7488"/></marker></defs><line class="ll" x1="140" y1="80" x2="140" y2="400"/><g class="k-src-app"><rect x="45" y="18" width="190" height="58" rx="8"/><text class="hd" x="140" y="41">생산자</text><text class="sb" x="140" y="60">알림 서버</text></g><line class="ll" x1="430" y1="80" x2="430" y2="400"/><g class="k-q"><rect x="335" y="18" width="190" height="58" rx="8"/><text class="hd" x="430" y="41">큐</text><text class="sb" x="430" y="60">SQS</text></g><line class="ll" x1="690" y1="80" x2="690" y2="400"/><g class="k-fn"><rect x="595" y="18" width="190" height="58" rx="8"/><text class="hd" x="690" y="41">소비자</text><text class="sb" x="690" y="60">작업 서버</text></g><rect class="band" x="421" y="235" width="18" height="140"/><text class="bandt" x="410" y="305">가시성 시간</text><rect class="band" x="682" y="265" width="16" height="70"/><text class="proc" x="708" y="302">처리</text><path class="ar" d="M144,130 L420,130" marker-end="url(#a)"/><text class="lb" x="285.0" y="120">① 메시지 전송</text><path class="ar dash" d="M426,185 L150,185" marker-end="url(#a)"/><text class="lb" x="285.0" y="175">② 저장 확인 (ACK)</text><path class="ar" d="M434,245 L680,245" marker-end="url(#a)"/><text class="lb" x="560.0" y="235">③ 메시지 수신</text><path class="ar" d="M686,375 L440,375" marker-end="url(#a)"/><text class="lb" x="560.0" y="365">④ 삭제 (커밋)</text><text class="nt2" x="285" y="212">② 를 못 받으면 재전송하므로 큐에 중복 적재</text><text class="nt2" x="560" y="415">④ 전에 죽으면 가시성 시간이 끝난 뒤 다시 수신</text></svg>
